<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 790" width="760" height="790"
     font-family="Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="760" height="790" fill="#fbfbfc"/>

  <text x="30" y="34" font-size="21" font-weight="700" fill="#1c2b36">Sensor Placement</text>
  <text x="30" y="55" font-size="12.5" fill="#5b6b77">Top down view, front of the vehicle at the top. Drawn to scale at 20 px per cm.</text>
  <text x="30" y="73" font-size="12.5" fill="#5b6b77">The nose is a trapezoid. Each of its three faces carries one distance sensor, mounted perpendicular to that face.</text>

  <!-- ===== sensing cones, 25 degree field of view ===== -->
  <g opacity="0.15" fill="#1565c0">
    <polygon points="380,190 358,110 402,110"/>
    <polygon points="305,220 221,166 251,136"/>
    <polygon points="455,220 509,136 539,166"/>
    <polygon points="380,490 396,563 364,563"/>
  </g>

  <defs>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#1565c0"/>
    </marker>
  </defs>
  <g stroke="#1565c0" stroke-width="1.6" marker-end="url(#tip)">
    <line x1="380" y1="190" x2="380" y2="118"/>
    <line x1="305" y1="220" x2="248" y2="163"/>
    <line x1="455" y1="220" x2="512" y2="163"/>
    <line x1="380" y1="490" x2="380" y2="558"/>
  </g>

  <!-- ===== chassis: trapezoidal nose, rectangular body =====
       front face   335,190 to 425,190      left face  335,190 to 275,250  (45 deg)
       right face   425,190 to 485,250      body sides 275,250 / 485,250 down to y=490 -->
  <polygon points="335,190 425,190 485,250 485,490 275,490 275,250"
           fill="#eceff1" stroke="#455a64" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="380" y1="190" x2="380" y2="490" stroke="#b0bec5"
        stroke-width="1" stroke-dasharray="5 5"/>

  <g fill="#37474f">
    <rect x="258" y="268" width="18" height="44" rx="4"/>
    <rect x="484" y="268" width="18" height="44" rx="4"/>
    <rect x="258" y="412" width="18" height="44" rx="4"/>
    <rect x="484" y="412" width="18" height="44" rx="4"/>
  </g>
  <text x="248" y="296" font-size="11" fill="#546e7a" text-anchor="end">steered</text>
  <text x="248" y="440" font-size="11" fill="#546e7a" text-anchor="end">driven</text>

  <!-- ===== distance sensors, one per nose face, one at the rear ===== -->
  <circle cx="380" cy="190" r="8" fill="#1565c0"/>
  <text x="380" y="90" font-size="12.5" font-weight="600" fill="#1c2b36" text-anchor="middle">Front ToF</text>
  <text x="380" y="105" font-size="11" fill="#5b6b77" text-anchor="middle">front face &#183; 0&#176; &#183; channel 0</text>

  <circle cx="305" cy="220" r="8" fill="#1565c0"/>
  <text x="196" y="142" font-size="12.5" font-weight="600" fill="#1c2b36" text-anchor="end">Left ToF</text>
  <text x="196" y="157" font-size="11" fill="#5b6b77" text-anchor="end">left face &#183; &#8722;45&#176; &#183; channel 3</text>

  <circle cx="455" cy="220" r="8" fill="#1565c0"/>
  <text x="556" y="142" font-size="12.5" font-weight="600" fill="#1c2b36">Right ToF</text>
  <text x="556" y="157" font-size="11" fill="#5b6b77">right face &#183; +45&#176; &#183; channel 4</text>

  <circle cx="380" cy="490" r="8" fill="#1565c0"/>
  <text x="400" y="516" font-size="12.5" font-weight="600" fill="#1c2b36">Rear ToF</text>
  <text x="400" y="531" font-size="11" fill="#5b6b77">rear face &#183; 180&#176; &#183; channel 5</text>

  <!-- ===== camera, and the colour sensor directly beneath its mount ===== -->
  <rect x="362" y="198" width="36" height="20" rx="4" fill="#6a1b9a"/>
  <text x="380" y="212" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">CAM</text>
  <circle cx="380" cy="243" r="11" fill="#2e7d32"/>

  <g stroke="#b0bec5" stroke-width="1">
    <line x1="399" y1="208" x2="504" y2="208"/>
    <line x1="392" y1="243" x2="504" y2="243"/>
  </g>
  <text x="512" y="204" font-size="12.5" font-weight="600" fill="#1c2b36">Camera Module 3</text>
  <text x="512" y="219" font-size="11" fill="#5b6b77">in the nose, elevated &#183; 66&#176; horizontal</text>
  <text x="512" y="239" font-size="12.5" font-weight="600" fill="#1c2b36">TCS34725</text>
  <text x="512" y="254" font-size="11" fill="#5b6b77">underside, below the camera mount</text>
  <text x="512" y="268" font-size="11" fill="#5b6b77">facing down &#183; channel 1</text>

  <!-- ===== IMU, set back from centre ===== -->
  <rect x="356" y="372" width="48" height="34" rx="5" fill="#ef6c00"/>
  <text x="380" y="394" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">IMU</text>
  <text x="380" y="426" font-size="12.5" font-weight="600" fill="#1c2b36" text-anchor="middle">BNO085</text>
  <text x="380" y="441" font-size="11" fill="#5b6b77" text-anchor="middle">rear of centre, mounted flat &#183; channel 2</text>

  <!-- ===== 45 degree marks ===== -->
  <g stroke="#90a4ae" stroke-width="1" stroke-dasharray="3 3">
    <line x1="305" y1="220" x2="305" y2="158"/>
    <line x1="455" y1="220" x2="455" y2="158"/>
  </g>
  <path d="M 305 182 A 38 38 0 0 0 278 193" stroke="#607d8b" stroke-width="1.3" fill="none"/>
  <path d="M 455 182 A 38 38 0 0 1 482 193" stroke="#607d8b" stroke-width="1.3" fill="none"/>
  <text x="296" y="176" font-size="11.5" font-weight="600" fill="#37474f" text-anchor="end">45&#176;</text>
  <text x="464" y="176" font-size="11.5" font-weight="600" fill="#37474f">45&#176;</text>

  <!-- ===== dimensions ===== -->
  <g stroke="#78909c" stroke-width="1.1">
    <line x1="275" y1="600" x2="485" y2="600"/>
    <line x1="275" y1="593" x2="275" y2="607"/>
    <line x1="485" y1="593" x2="485" y2="607"/>
    <line x1="226" y1="190" x2="226" y2="490"/>
    <line x1="219" y1="190" x2="233" y2="190"/>
    <line x1="219" y1="490" x2="233" y2="490"/>
    <line x1="335" y1="168" x2="425" y2="168"/>
    <line x1="335" y1="162" x2="335" y2="174"/>
    <line x1="425" y1="162" x2="425" y2="174"/>
  </g>
  <text x="380" y="620" font-size="12" fill="#37474f" text-anchor="middle">10.5 cm wide</text>
  <text x="210" y="340" font-size="12" fill="#37474f" text-anchor="middle"
        transform="rotate(-90 210 340)">15.0 cm long</text>
  <!-- TODO: measure the front face and replace this label with the figure -->
  <text x="380" y="158" font-size="10.5" fill="#90a4ae" text-anchor="middle">front face</text>

  <!-- ===== legend ===== -->
  <rect x="215" y="646" width="330" height="132" rx="8" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="231" y="670" font-size="13" font-weight="700" fill="#1c2b36">Legend</text>
  <circle cx="239" cy="692" r="7" fill="#1565c0"/>
  <text x="255" y="696" font-size="11.5" fill="#37474f">VL53L0X distance</text>
  <rect x="232" y="712" width="14" height="12" rx="3" fill="#6a1b9a"/>
  <text x="255" y="722" font-size="11.5" fill="#37474f">Camera</text>
  <rect x="232" y="738" width="14" height="12" rx="3" fill="#ef6c00"/>
  <text x="255" y="748" font-size="11.5" fill="#37474f">IMU</text>
  <circle cx="389" cy="692" r="7" fill="#2e7d32"/>
  <text x="405" y="696" font-size="11.5" fill="#37474f">Colour, underside</text>
  <polygon points="382,712 396,706 396,724" fill="#1565c0" opacity="0.35"/>
  <text x="405" y="722" font-size="11.5" fill="#37474f">Sensing cone, 25&#176;</text>
  <rect x="382" y="738" width="14" height="12" rx="3" fill="#37474f"/>
  <text x="405" y="748" font-size="11.5" fill="#37474f">Wheel</text>
</svg>
